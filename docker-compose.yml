services:
  mariadb:
    image: mariadb:latest
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      MYSQL_DATABASE: bd_restaurante
    volumes:
      - db_data:/var/lib/mysql
      - ./database:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  gateway:
    image: ivanascardona/ms-gateway:latest
    build:
      context: .
      dockerfile: gateway/Dockerfile
    restart: unless-stopped
    environment:
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en .env}
      - MS_USUARIOS_URL=http://ms-usuarios:3001
      - MS_MENU_URL=http://ms-menu:3002
      - MS_PEDIDOS_URL=http://ms-pedidos:3003
    depends_on:
      ms-usuarios:
        condition: service_started
      ms-menu:
        condition: service_started
      ms-pedidos:
        condition: service_started

  ms-usuarios:
    image: ivanascardona/ms-usuarios:latest
    build: ./ms.usuarios
    restart: unless-stopped
    environment:
      - PORT=3001
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en .env}
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      - DB_NAME=bd_restaurante
    depends_on:
      mariadb:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - ms-usuarios

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Define GRAFANA_ADMIN_PASSWORD en .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "${GRAFANA_PORT:-3005}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

  ms-menu:
    image: ivanascardona/ms-menu:latest
    build: ./ms.menu
    restart: unless-stopped
    environment:
      - PORT=3002
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      - DB_NAME=bd_restaurante
    depends_on:
      mariadb:
        condition: service_healthy

  ms-pedidos:
    image: ivanascardona/ms-pedidos:latest
    build: ./ms.pedidos
    restart: unless-stopped
    environment:
      - PORT=3003
      - JWT_SECRET=${JWT_SECRET:?Define JWT_SECRET en .env}
      - DB_HOST=mariadb
      - DB_USER=root
      - DB_PASSWORD=${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
      - DB_NAME=bd_restaurante
    depends_on:
      mariadb:
        condition: service_healthy

  frontend:
    image: ivanascardona/ms-restaurante-frontend:latest
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - gateway

volumes:
  db_data:
  prometheus_data:
  grafana_data: